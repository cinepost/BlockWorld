[package]
name = "blockworld"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
rodio = { version = "0.21", default-features = false, features = ["playback", "mp3"] }
ash = "0.38"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
ash-window = "0.13"
raw-window-handle = "0.6"
imgui = "0.12"
imgui-winit-support = "0.13"
imgui-rs-vulkan-renderer = "1.16"
winit = "0.30"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"] }
guillotiere = { version = "0.6", default-features = false }
serde_json = { version = "1", features = ["std"] }

[build-dependencies]
naga = { version = "24", features = ["wgsl-in", "spv-out"] }

[profile.release]
lto = "thin"

[profile.dev]
opt-level = 1
